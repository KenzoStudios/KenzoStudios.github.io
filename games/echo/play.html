function drawCreatureFull(type, x, y, ang, phase, a, vx, vy, mark) {
  a = Math.min(1.3, a);
  ctx.globalAlpha = Math.min(1, a * 0.55);
  ctx.drawImage(SPR.red, x - 36, y - 36, 72, 72);
  ctx.globalAlpha = 1;
  const vl = Math.hypot(vx, vy);
  if (vl > 10) for (let k = 2; k >= 1; k--) drawCreatureShape(type, x - vx * 0.075 * k, y - vy * 0.075 * k, ang, phase - k * 0.3, a * 0.2 / k);
  drawCreatureShape(type, x + 1.4, y, ang, phase, a * 0.18);        // faint doubled edge, like a smeared echo
  drawCreatureShape(type, x, y, ang, phase, a);
  if (mark) {
    ctx.font = `700 13px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = rgba(mark === '!' ? [255, 90, 60] : [255, 190, 110], Math.min(1, a) * 0.95);
    ctx.fillText(mark, x, y - 28);
  }
}

function drawCreatures(rt, alpha) {
  for (const g of G.ghosts) {
    const age = rt - g.t0;
    if (age < 0 || age > g.dur) continue;
    let a = g.str * Math.pow(1 - age / g.dur, 1.3);
    if (age < 0.1) a *= 1 + (1 - age / 0.1) * 0.6;
    drawCreatureFull(g.type, g.x, g.y, g.ang, g.phase, a, g.vx, g.vy, g.mark);
  }
  // Live silhouettes: creatures standing in flare light, lunging at you, or the one that got you
  for (const c of G.creatures) {
    const live = c.inFlare || c.state === 'lunge' || c === G.killer;
    if (!live) continue;
    const x = lerp(c.px, c.x, alpha), y = lerp(c.py, c.y, alpha);
    const a = c === G.killer ? 1.1 : c.state === 'lunge' ? 1 : 0.8;
    drawCreatureFull(c.type, x, y, c.heading, c.phase, a, c.vx, c.vy, c.inFlare || c.state === 'lunge' ? c.mark() : '');
  }
}

function drawShockRings(rt) {
  for (const s of G.shockRings) {
    const age = rt - s.t0;
    if (age < 0 || age > 1.4) continue;
    const u = age / 1.4, r = 16 + s.r * (1 - Math.pow(1 - u, 2.2));
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, TAU);
    ctx.strokeStyle = rgba(COL.creature, (1 - u) * 0.12); ctx.lineWidth = 10 * linePx(); ctx.stroke();
    ctx.strokeStyle = rgba(COL.creature, (1 - u) * 0.55); ctx.lineWidth = 1.4 * linePx(); ctx.stroke();
  }
}

function drawParticles() {
  for (const pt of G.particles) {
    if (pt.dead) continue;
    const a = pt.life / pt.max;
    ctx.fillStyle = `rgba(${pt.r},${pt.g},${pt.b},${a})`;
    const s = pt.size * (0.5 + a);
    ctx.fillRect(pt.x - s / 2, pt.y - s / 2, s, s);
  }
}

function renderWorld(alpha) {
  const rt = G.time + alpha * CFG.STEP;
  const c = G.cam;
  let cx = lerp(c.px, c.x, alpha), cy = lerp(c.py, c.y, alpha);
  const shake = REDUCED_MOTION ? G.shake * 0.25 : G.shake;
  if (shake > 0.05) { cx += (FX.float() - 0.5) * shake * 2 / ZOOM; cy += (FX.float() - 0.5) * shake * 2 / ZOOM; }
  ctx.setTransform(DPR * ZOOM, 0, 0, DPR * ZOOM, DPR * (CW / 2 - cx * ZOOM), DPR * (CH / 2 - cy * ZOOM));
  const hw = CW / 2 / ZOOM + 40, hh = CH / 2 / ZOOM + 40;
  ctx.globalCompositeOperation = 'lighter';
  drawFlares(rt);
  drawWalls(rt, cx - hw, cy - hh, cx + hw, cy + hh);
  drawStepRings(rt);
  drawExit(rt);
  drawPickups(rt);
  drawPings(rt);
  drawShockRings(rt);
  drawCreatures(rt, alpha);
  drawParticles();
  drawPlayer(rt, alpha);
  ctx.globalCompositeOperation = 'source-over';
}

function renderPost() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(vignetteCanvas, 0, 0);
  const inGame = G.state === 'playing' || G.state === 'dying' || G.state === 'paused';
  // The hunt closing in bleeds red into the edges; slow motion crushes the frame
  const danger = inGame ? clamp((G.tension - 0.3) / 0.7, 0, 1) : 0;
  const slow = clamp((1 - G.timeScale) / 0.7, 0, 1);
  if (danger > 0.01 || slow > 0.01) {
    ctx.globalAlpha = Math.min(1, danger * (0.55 + 0.25 * Math.sin(G.realTime * 5.5)) + slow * 0.6);
    ctx.drawImage(redVignetteCanvas, 0, 0);
    ctx.globalAlpha = 1;
  }
  if (G.flash > 0.01) { ctx.fillStyle = `rgba(255,40,30,${G.flash * 0.28})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = grainCanvas.pattern;
  const ox = Math.floor(FX.float() * 192), oy = Math.floor(FX.float() * 192);
  ctx.translate(-ox, -oy);
  ctx.fillRect(0, 0, canvas.width + ox, canvas.height + oy);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
}

function text(str, x, y, size, color, align = 'left', weight = 400, spacing = 0, font = MONO) {

// UI scale: comfortable on a laptop, still legible on a narrow window
const uiScale = () => clamp(Math.min(CW / 1000, CH / 720), 0.72, 1.35);

/* ═══════════════════════════ 11. UI & FLOW ═══════════════════════════ */
const DISPLAY = '"Avenir Next", Futura, "Century Gothic", "Segoe UI", "Helvetica Neue", Arial, sans-serif';

// — Echo text: glyph outlines traced with the same marching squares as the caves, lit by rings —
const echoTextCache = new Map();
function buildEchoText(str) {
  if (echoTextCache.has(str)) return echoTextCache.get(str);
  const fs = 140, cell = 3, spacing = fs * 0.14, chars = [...str];
  const cv = document.createElement('canvas'), g = cv.getContext('2d');
  const font = `800 ${fs}px ${DISPLAY}`;
  g.font = font;
  const widths = chars.map((ch) => g.measureText(ch).width);
  const tw = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  cv.width = Math.ceil(tw + fs * 0.4); cv.height = Math.ceil(fs * 1.35);
  g.font = font; g.fillStyle = '#fff'; g.textBaseline = 'middle';
  let x = fs * 0.2;
  chars.forEach((ch, i) => { g.fillText(ch, x, cv.height / 2); x += widths[i] + spacing; });
  const img = g.getImageData(0, 0, cv.width, cv.height).data;
  const W = Math.ceil(cv.width / cell) + 2, H = Math.ceil(cv.height / cell) + 2;
  const A = new Float32Array(W * H);
  for (let j = 1; j < H - 1; j++) for (let i = 1; i < W - 1; i++) {
    const px = (i - 1) * cell + 1, py = (j - 1) * cell + 1;
    let sum = 0, cnt = 0;
    for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
      const xx = px + ox, yy = py + oy;
      if (xx < 0 || yy < 0 || xx >= cv.width || yy >= cv.height) { cnt++; continue; }
      sum += img[(yy * cv.width + xx) * 4 + 3]; cnt++;
    }
    A[j * W + i] = sum / cnt / 255;
  }
  const isWall = (i, j) => (A[j * W + i] > 0.5 ? 1 : 0);
  const cross = (a0, a1) => clamp((0.5 - a0) / ((a1 - a0) || 1e-6), 0, 1);
  const crossX = (i, j) => (i + 0.5 + cross(A[j * W + i], A[j * W + i + 1])) * cell;
  const crossY = (i, j) => (j + 0.5 + cross(A[j * W + i], A[(j + 1) * W + i])) * cell;
  const ms = marchSquares(W, H, cell, isWall, crossX, crossY);
  const segs = ms.segs, n = ms.nSegs, mx = new Float32Array(n), my = new Float32Array(n);
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let s = 0; s < n; s++) {
    mx[s] = (segs[s * 4] + segs[s * 4 + 2]) / 2; my[s] = (segs[s * 4 + 1] + segs[s * 4 + 3]) / 2;
    x0 = Math.min(x0, segs[s * 4], segs[s * 4 + 2]); x1 = Math.max(x1, segs[s * 4], segs[s * 4 + 2]);
    y0 = Math.min(y0, segs[s * 4 + 1], segs[s * 4 + 3]); y1 = Math.max(y1, segs[s * 4 + 1], segs[s * 4 + 3]);
  }
  const et = { segs, n, mx, my, w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0), cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
  if (echoTextCache.size >= 6) for (const k of echoTextCache.keys()) if (k.startsWith('DEPTH')) { echoTextCache.delete(k); break; }
  echoTextCache.set(str, et);
  return et;
}

// Rings in text space: origins given as fractions of the word's width/height from its centre
function periodicRings(et, t, period, origins, start = 0) {
  const out = [], k = Math.floor((t - start) / period);
  for (let j = k - 1; j <= k; j++) {
    if (j < 0) continue;
    const o = origins[j % origins.length];
    out.push({ t0: start + j * period, x: et.cx + o[0] * et.w, y: et.cy + o[1] * et.h });
  }
  return out;
}

const ET_NB = 10, etBuckets = Array.from({ length: ET_NB }, () => []);
function drawEchoText(et, cx, cy, width, t, o) {
  const s = width / et.w, fade = o.alpha == null ? 1 : o.alpha;
  if (fade <= 0.005) return;
  ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * (cx - et.cx * s), DPR * (cy - et.cy * s));
  for (const b of etBuckets) b.length = 0;
  const rings = o.rings, decay = o.decay || 1.7, speed = o.speed || et.w * 1.1, base = o.base || 0;
  for (let i = 0; i < et.n; i++) {
    let b = base;
    for (const r of rings) {
      const age = t - r.t0 - Math.hypot(et.mx[i] - r.x, et.my[i] - r.y) / speed;
      if (age >= 0 && age < decay) {
        let v = Math.pow(1 - age / decay, 1.5);
        if (age < 0.12) v *= 1 + (1 - age / 0.12) * 0.6;
        if (v > b) b = v;
      }
    }
    b *= fade;
    if (b > 0.01) etBuckets[Math.min(ET_NB - 1, Math.floor(b / 1.6 * ET_NB))].push(i);
  }
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const col = o.color || COL.wall;
  for (let k = 0; k < ET_NB; k++) {
    const list = etBuckets[k];
    if (!list.length) continue;
    const bv = (k + 0.5) / ET_NB * 1.6, a = Math.min(1, bv);
    ctx.beginPath();
    for (const i of list) { const q = i * 4; ctx.moveTo(et.segs[q], et.segs[q + 1]); ctx.lineTo(et.segs[q + 2], et.segs[q + 3]); }
    ctx.strokeStyle = rgba(col, a * 0.08); ctx.lineWidth = 11 / s; ctx.stroke();
    ctx.strokeStyle = rgba(col, a * 0.22); ctx.lineWidth = 3.8 / s; ctx.stroke();
    const w = Math.max(0, bv - 0.85) * 1.6;
    ctx.strokeStyle = rgba([lerp(col[0], 255, w), lerp(col[1], 255, w), lerp(col[2], 255, w)], a); ctx.lineWidth = 1.35 / s; ctx.stroke();
  }
  if (o.showRings) {
    for (const r of rings) {
      const rr = (t - r.t0) * speed, f = 1 - rr / (et.w * 1.4);
      if (rr <= 0 || f <= 0) continue;
      ctx.beginPath(); ctx.arc(r.x, r.y, rr, 0, TAU);
      ctx.strokeStyle = rgba(col, f * 0.16 * fade); ctx.lineWidth = 1.2 / s; ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// — Hints: one line at a time, fading in and out at the bottom of the screen —
const Hints = {
  queue: [], cur: null, seen: new Set(),
  show(id, str, dur = 5) {
    if (this.seen.has(id)) return;
    this.seen.add(id);
    this.queue.push({ id, str, dur, t: 0 });
  },
  skip(id) {                                  // the player already did it — don't lecture
    this.seen.add(id);
    this.queue = this.queue.filter((h) => h.id !== id);
    if (this.cur && this.cur.id === id && this.cur.t < this.cur.dur) this.cur.t = this.cur.dur;
  },
  clear() { this.queue.length = 0; this.cur = null; },
  update(dt) {
    if (this.cur) { this.cur.t += dt; if (this.cur.t > this.cur.dur + 0.4) this.cur = null; }
    if (!this.cur && this.queue.length) this.cur = this.queue.shift();
  },
  render() { if (this.cur) renderHintPanel(this.cur); },
};

// — Tutorial (depth 1, until the player has once reached depth 2) —
const Tut = {
  active: false, moved: 0, t: 0,
  begin() {
    this.active = G.depth === 1 && !store.get('echo.tutorial', false);
    this.moved = 0; this.t = 0;
    if (this.active) Hints.show('move', 'WASD or arrow keys to move.', 4);
    else if (G.depth === 1) Hints.show('keys', 'WASD move  ·  SPACE ping, hold to charge  ·  RIGHT-CLICK focused ping  ·  C creep  ·  F flare', 6);
  },
  update(dt) {
    if (!this.active) return;
    const p = G.player;
    this.t += dt;
    this.moved += Math.hypot(p.x - p.px, p.y - p.py);
    if (this.moved > 90) { Hints.skip('move'); Hints.show('ping', 'SPACE or click sends a ping. Its echo shows you the walls.', 5); }
    if (this.t > 45) Hints.show('creep', 'Hold C to creep. Silent. Nothing down here can see — but everything can hear.', 6);
  },
  onPing(kind) {
    if (!this.active) return;
    Hints.skip('ping');
    if (kind === 'normal') Hints.show('charge', 'Hold to charge a wider ping. Louder too — heard from much farther away.', 5.5);
    if (kind === 'charged') { Hints.skip('charge'); Hints.show('dir', 'Right-click (or Shift) sends a quiet, narrow ping toward the cursor.', 5.5); }
    if (kind === 'dir') { Hints.skip('dir'); Hints.show('creep', 'Hold C to creep. Silent. Nothing down here can see — but everything can hear.', 6); }
  },
};

const introSeen = store.get('echo.intro', {});
function introCreatures() {
  const seen = introSeen, types = new Set(G.creatures.map((c) => c.type));
  if (types.has('stalker') && !seen.stalker) {
    Hints.show('i-stalker', 'Something breathes down here. STALKERS are fast, but move only while they can hear you. Silence stops them cold.', 7);
    seen.stalker = 1;
  }
  if (types.has('listener') && !seen.listener) {
    Hints.show('i-listener', 'LISTENERS never move. They echolocate: freeze when their amber ring passes, and never ping near one.', 7);
    seen.listener = 1;
  }
  store.set('echo.intro', seen);
}

// — Game flow —
function setCursor(show) {
  const v = show ? 'default' : 'none';
  if (canvas.style.cursor !== v) canvas.style.cursor = v;
}

function resetWorldLists() {
  G.pings.length = 0; G.ghosts.length = 0; G.particles.length = 0; G.flares.length = 0;
  G.stepRings.length = 0; G.shockRings.length = 0; G.pickups = []; G.creatures = [];
  G.exit = null; G.killer = null; G.tension = 0; G.slowTimer = 0; G.timeScale = 1;
}

function setupTitle() {
  G.state = 'title';
  Audio.detachVoices();
  Hints.clear();
  resetWorldLists();
  G.time = 0; G.depth = 5;
  G.lvl = L = generateLevel(randomSeed(), 5);
  G.player = { x: -1e6, y: -1e6, px: -1e6, py: -1e6, vx: 0, vy: 0, alive: false, noise: 0, flares: 0 };
  G.creatures = L.spawns.map((s) => new Creature(s.type, s.x, s.y, 5));
  G.levelStart = -10;
  const open = [];
  for (let c = 0; c < L.W * L.H; c++) if (L.clr[c] >= 30) open.push(c);
  if (open.length < 10) for (let c = 0; c < L.W * L.H; c++) if (L.clr[c] >= 16) open.push(c);
  G.demo = { open, next: 0.5, tx: 0, ty: 0, t0: G.realTime };
  const c0 = cellCenter(open[Math.floor(FX.float() * open.length)]);
  G.cam.x = G.cam.px = c0.x; G.cam.y = G.cam.py = c0.y;
  pickDemoTarget();
  G.best = store.get('echo.best', null);
  setCursor(true);
}
function pickDemoTarget() {
  const d = G.demo;
  for (let k = 0; k < 40; k++) {
    const c = cellCenter(d.open[Math.floor(FX.float() * d.open.length)]);
    const dist = Math.hypot(c.x - G.cam.x, c.y - G.cam.y);
    if (dist > 250 && dist < 900) { d.tx = c.x; d.ty = c.y; return; }
  }
  const c = cellCenter(d.open[0]); d.tx = c.x; d.ty = c.y;
}
function updateTitle(dt) {
  G.time += dt;
  const c = G.cam, d = G.demo;
  c.px = c.x; c.py = c.y;
  const dx = d.tx - c.x, dy = d.ty - c.y, dl = Math.hypot(dx, dy);
  if (dl < 40) pickDemoTarget(); else { c.x += dx / dl * 24 * dt; c.y += dy / dl * 24 * dt; }
  d.next -= dt;
  if (d.next <= 0) {
    d.next = 1.3 + FX.float() * 1.3;
    for (let k = 0; k < 30; k++) {
      const p = cellCenter(d.open[Math.floor(FX.float() * d.open.length)]);
      if (Math.hypot(p.x - c.x, p.y - c.y) < 480) { createPing('player', p.x, p.y, { radius: 240 + FX.float() * 240, speed: 380, reveal: 2.8, strength: 0.55 }); break; }
    }
  }
  for (const cr of G.creatures) { cr.px = cr.x; cr.py = cr.y; }
  updateCreatures(dt);
  updatePings();
  for (let i = G.ghosts.length - 1; i >= 0; i--) if (G.time - G.ghosts[i].t0 > G.ghosts[i].dur) G.ghosts.splice(i, 1);
}

function startRun(seed) {
  Audio.init();
  resetWorldLists();
  Hints.clear();
  G.runSeed = seed >>> 0;
  G.shards = 0; G.pingCount = 0; G.player = null; G.time = 0;
  G.pendingDepth = 1;
  G.state = 'descending'; G.descendT = 0.9; G.descendLoaded = false; G.descendFrom = null; G.levelShards = 0;
  G.runStart = G.realTime;
  setCursor(false);
}

function reachExit() {
  if (G.state !== 'playing') return;
  const ex = G.exit;
  Audio.exit();
  for (let i = 0; i < 50; i++) {
    const a = FX.float() * TAU, s = 40 + FX.float() * 200;
    spawnParticle(ex.x, ex.y, Math.cos(a) * s, Math.sin(a) * s, 0.6 + FX.float() * 0.8, 200, 170, 255, 1.8);
  }
  if (G.depth === 1) store.set('echo.tutorial', true);
  G.player.charging = false; G.player.charge = 0;
  G.pendingDepth = G.depth + 1;
  G.descendFrom = { x: ex.x, y: ex.y };
  G.state = 'descending'; G.descendT = 0; G.descendLoaded = false;
  Hints.clear();
}

function updateDescent(dt) {
  G.descendT += dt;
  if (!G.descendLoaded && G.descendT >= 0.9) {
    loadLevel(G.pendingDepth);
    HUD.reset();
    G.descendLoaded = true;
  }
  if (G.descendT >= 2.75) {
    G.state = 'playing'; G.fadeIn = 1;
    Input.dirPing = false; Input.pingReleased = false;
    HUD.bootT = 0;
    Tut.begin();
    introCreatures();
  }
}

function pauseGame() {
  if (G.state !== 'playing') return;
  G.state = 'paused';
  Input.reset();
  G.player.charging = false; G.player.charge = 0; G.player.holdT = 0;
  Audio.suspend();
  setCursor(true);
}
function resumeGame() {
  if (G.state !== 'paused') return;
  G.state = 'playing';
  Audio.resume();
  lastFrame = performance.now();
  setCursor(false);
}

// — Hooks called by the simulation —
function onPingFired(kind, charge) {
  G.pingCount = (G.pingCount || 0) + 1;
  const last = G.pings[G.pings.length - 1];
  Audio.ping(kind, charge, last ? last.ang : 0);
  Tut.onPing(kind);
}
function onFootstep(sp) { Audio.footstep(sp); }
function onBump() { Audio.bump(); }
function onFlarePlaced() { Hints.skip('flare'); }
function onPickupRevealed(pk) { if (pk.kind === 'shard' && Tut.active) Hints.show('shard', 'Echo shards. Collect them — they are all the light you get to keep.', 4.5); }
function onExitRevealed() {
  if (G.state === 'playing') HUD.contact('exit', '', G.exit.x, G.exit.y, 'exit');
  if (G.depth === 1) Hints.show('exit', 'That violet pulse is the way down. Reach it.', 4.5);
}
function onCreatureAlerted() {}
function onCreatureRevealed(c, pg) {
  if (pg.src === 'player' && G.state === 'playing') { Audio.contact(c); HUD.contact(c.type, c.mark(), c.x, c.y, c); }
  if (c.type === 'crawler' && G.state === 'playing') {
    if (!introSeen.crawler) { Hints.show('i-crawler', 'A CRAWLER. Blind — it hunts what it hears. Back away quietly.', 5.5); introSeen.crawler = 1; store.set('echo.intro', introSeen); }
  }
}
function onListenerAlarm(c) {
  Audio.alarm(c);
  if (G.state === 'playing') HUD.contact('listener', 'shriek', c.x, c.y, c);
  if (G.state === 'playing') Hints.show('alarm', 'A Listener shrieked. Everything near it is coming to where you stood — move.', 5);
}
function onListenerCharging(c) { Audio.listenerClicks(c); }
function onListenerPing(c) { Audio.listenerPing(c); }
function onListenerMissed() { if (G.state === 'playing') Hints.show('still', 'Its echo passed over you. Stillness hides you from a Listener.', 4.5); }
function onLunge(c) { Audio.lunge(c); }
function onDeath(c) {
  Audio.death();
  const best = store.get('echo.best', null);
  const run = { depth: G.depth, shards: G.shards, seed: G.runSeed };
  G.newBest = !best || run.depth > best.depth || (run.depth === best.depth && run.shards > best.shards);
  if (G.newBest) store.set('echo.best', run);
  G.best = G.newBest ? run : best;
  G.deathLine = {
    crawler: 'A Crawler found you in the dark.',
    stalker: 'A Stalker heard you move.',
    listener: 'You walked into a Listener.',
  }[c.type];
  Hints.clear();
}

// — Screens —
function drawKeyList(cx, y, u, alpha) {
  const rows = [
    ['WASD / ARROWS', 'move'],
    ['SPACE / CLICK', 'ping'],
    ['HOLD', 'charged ping — wider, louder'],
    ['RIGHT-CLICK / SHIFT', 'focused ping — narrow, quiet'],
    ['C / CTRL', 'creep — silent, slow'],
    ['F', 'plant a flare'],
    ['ESC · M', 'pause · mute'],
  ];
  const size = Math.round(11.5 * u), lh = size * 1.95;
  rows.forEach(([k, v], i) => {
    const yy = y + i * lh;
    text(k, cx - 12 * u, yy, size, `rgba(95,245,228,${0.85 * alpha})`, 'right', 500, 1.5);
    text(v, cx + 12 * u, yy, size, `rgba(190,215,212,${0.62 * alpha})`, 'left', 400, 0.5);
  });
  return rows.length * lh;
}

function renderTitle() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const u = uiScale(), t = G.realTime - G.demo.t0;
  // hush the demo cave behind the type
  const g = ctx.createRadialGradient(CW / 2, CH * 0.42, 0, CW / 2, CH * 0.42, Math.max(CW, CH) * 0.6);
  g.addColorStop(0, 'rgba(2,4,5,0.78)'); g.addColorStop(1, 'rgba(2,4,5,0.25)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);

  const et = buildEchoText('ECHO');
  const w = Math.min(CW * 0.7, 640 * u), h = w * et.h / et.w, ty = CH * 0.3;
  const rings = periodicRings(et, t, 3.6, [[-0.62, 0.1], [0.62, -0.2], [0, 0.9], [-0.2, -0.9]], 0.2);
  drawEchoText(et, CW / 2, ty, w, t, { rings, base: 0.07 + 0.05 * smoothstep(clamp(t / 3, 0, 1)), showRings: true });
  const a1 = smoothstep(clamp((t - 0.8) / 1.2, 0, 1));
  text('EVERY SOUND YOU MAKE IS HEARD', CW / 2, ty + h / 2 + 34 * u, Math.round(12 * u), `rgba(170,215,210,${0.7 * a1})`, 'center', 400, 5 * u);

  const a2 = smoothstep(clamp((t - 1.4) / 1.2, 0, 1));
  const listH = drawKeyList(CW / 2, ty + h / 2 + 96 * u, u, a2);

  const a3 = smoothstep(clamp((t - 2.0) / 1, 0, 1)) * (0.55 + 0.45 * Math.sin(G.realTime * 2.6));
  const py = Math.min(CH - 70 * u, ty + h / 2 + 96 * u + listH + 30 * u);
  text('PRESS ANY KEY TO DESCEND', CW / 2, py, Math.round(13 * u), `rgba(225,255,250,${a3})`, 'center', 500, 6 * u);

  const a4 = 0.5 * a2;
  const b = G.best;
  if (b) text(`DEEPEST  ${String(b.depth).padStart(2, '0')}  ·  ${b.shards} SHARDS`, 24, CH - 26, Math.round(10.5 * u), `rgba(178,140,255,${a4 * 1.4})`, 'left', 500, 2);
  text('HEADPHONES RECOMMENDED', CW - 24, CH - 26, Math.round(10.5 * u), `rgba(170,215,210,${a4})`, 'right', 400, 2);
}

// ═════════════════════════════ HUD — the sonar console ═════════════════════════════
// Visual language: a sci-fi FUI instrument. 1px linework, corner brackets and tick scales; glow is
// reserved for live values. Every state carries text and shape as well as colour. Captions sit at
// ≥ 4.5:1 against the cave ground, and a soft scrim keeps each module legible over lit rock.
const HT = {
  ink: [95, 245, 228],      // sonar — primary
  text: [212, 242, 238],    // readouts
  label: [150, 200, 196],   // captions (used at α ≥ .75)
  warn: [255, 176, 92],     // heard / loud
  danger: [255, 78, 58],    // creatures / hunted
  exit: [178, 140, 255],    // portal / records
  shard: [222, 234, 255],
  flare: [205, 255, 215],
};
const SCOPE_RANGE = 1400;               // world units at the scope's rim
const UNITS_PER_M = 16;                 // one cave cell = 2 m
const meters = (v) => Math.max(0, Math.round(v / UNITS_PER_M));
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const hfs = (n, u) => Math.max(11, Math.round(n * u * 2) / 2);   // HUD type never drops below 11px
const hudScale = () => clamp(uiScale(), 0.94, 1.35);             // …so its spacing can't either
const mixCol = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const huntTint = () => (G.player && G.player.alive ? clamp((G.tension - 0.3) / 0.5, 0, 1) : 0);   // the instrument reddens as the hunt closes
// Snap a line coordinate so 1px strokes land on whole device pixels
const crisp = (v, lw = 1) => { const d = Math.round(v * DPR), w = Math.round(lw * DPR); return (w % 2 ? d + 0.5 : d) / DPR; };

const HUD = {
  bootT: 10, aimT: 0, consoleTop: 1e9,
  noise: new Float32Array(120), noiseI: 0, noiseAcc: 0,      // 4 s of hydrophone at 30 Hz
  contacts: [], shardFlash: 0, flareFlash: 0, readyFlash: 0, wasReady: true, best: 0,
  reset() {
    this.bootT = 0; this.noise.fill(0); this.noiseI = 0; this.noiseAcc = 0; this.contacts.length = 0;
    this.shardFlash = 0; this.flareFlash = 0; this.readyFlash = 0; this.wasReady = true;
    const b = store.get('echo.best', null);
    this.best = b ? b.depth : 0;
  },
  update(dt) {
    this.bootT = Math.min(10, this.bootT + dt);
    this.shardFlash = Math.max(0, this.shardFlash - dt / 0.45);
    this.flareFlash = Math.max(0, this.flareFlash - dt / 0.45);
    this.readyFlash = Math.max(0, this.readyFlash - dt / 0.3);
    this.aimT += ((Input.shift() ? 1 : 0) - this.aimT) * Math.min(1, dt * 14);
    const p = G.player;
    if (!p) return;
    const ready = p.pingCD <= 0;
    if (ready && !this.wasReady) this.readyFlash = 1;
    this.wasReady = ready;
    this.noiseAcc += dt;
    while (this.noiseAcc >= 1 / 30) {
      this.noiseAcc -= 1 / 30;
      this.noise[this.noiseI] = p.noise;
      this.noiseI = (this.noiseI + 1) % this.noise.length;
    }
    for (let i = this.contacts.length - 1; i >= 0; i--) if (G.realTime - this.contacts[i].t0 > 4.9) this.contacts.splice(i, 1);
  },
  // A sonar contact report: newest on top, one line per thing, refreshed when pinged again
  contact(kind, mark, x, y, id) {
    const i = this.contacts.findIndex((c) => c.id === id);
    if (i >= 0) this.contacts.splice(i, 1);
    this.contacts.unshift({ kind, mark, x, y, id, t0: G.realTime });
    if (this.contacts.length > 4) this.contacts.length = 4;
  },
};

function ghostAlpha(g, t) {
  const age = t - g.t0;
  if (age < 0 || age > g.dur) return 0;
  return Math.min(1, g.str * Math.pow(1 - age / g.dur, 1.3));
}

// — Primitives —
function drawDiamond(x, y, s, col, a, fill = 0) {
  ctx.beginPath(); ctx.moveTo(x, y - s * 1.4); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s * 1.4); ctx.lineTo(x - s, y); ctx.closePath();
  if (fill > 0) { ctx.fillStyle = rgba(col, a * fill); ctx.fill(); }
  ctx.strokeStyle = rgba(col, a); ctx.lineWidth = 1.2; ctx.stroke();
}
function drawArrow(x, y, ang, s, col, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, -s * 0.8); ctx.lineTo(-s * 0.3, 0); ctx.lineTo(-s * 0.7, s * 0.8); ctx.closePath();
  ctx.fillStyle = rgba(col, a); ctx.fill();
  ctx.restore();
}
function bracket(x, y, sx, sy, arm, col, a) {
  const bx = crisp(x), by = crisp(y);
  ctx.beginPath(); ctx.moveTo(bx + sx * arm, by); ctx.lineTo(bx, by); ctx.lineTo(bx, by + sy * arm);
  ctx.strokeStyle = rgba(col, a); ctx.lineWidth = 1; ctx.stroke();
}
function bracketBox(x, y, w, h, arm, col, a) {
  bracket(x, y, 1, 1, arm, col, a); bracket(x + w, y, -1, 1, arm, col, a);
  bracket(x, y + h, 1, -1, arm, col, a); bracket(x + w, y + h, -1, -1, arm, col, a);
}
function scrim(cx, cy, rx, ry, a) {
  const g = ctx.globalAlpha;
  ctx.globalAlpha = g * a;
  ctx.drawImage(SPR.scrim, cx - rx, cy - ry, rx * 2, ry * 2);
  ctx.globalAlpha = g;
}
function glowText(str, x, y, size, col, a, align, weight, track, blur) {
  ctx.save();
  ctx.shadowColor = rgba(col, 0.75 * a); ctx.shadowBlur = blur;
  text(str, x, y, size, rgba(col, a), align, weight, track);
  ctx.restore();
}
// A bordered status tag. Filled = active/urgent, outline = informational. Returns its width.
function chip(str, x, y, size, col, a, filled, align = 'left') {
  const padX = Math.round(size * 0.6), h = Math.round(size * 1.7);
  const w = Math.round(measure(str, size, 600, 1.5) + padX * 2 - 1.5);
  const left = align === 'right' ? x - w : x, top = Math.round(y - h / 2);
  if (filled) { ctx.fillStyle = rgba(col, 0.17 * a); ctx.fillRect(left, top, w, h); }
  ctx.strokeStyle = rgba(col, 0.72 * a); ctx.lineWidth = 1;
  ctx.strokeRect(crisp(left), crisp(top), w, h);
  text(str, left + padX, y + 0.5, size, rgba(col, a), 'left', 600, 1.5);
  return w;
}

// — Modules —
function drawScreenFrame(u, a) {
  if (a <= 0) return;
  const tint = huntTint(), col = mixCol(HT.ink, HT.danger, tint);
  const i = Math.round(12 * u), arm = 22 * u * (0.3 + 0.7 * a) * (1 + 0.35 * tint), al = (0.28 + 0.3 * tint) * a;
  bracket(i, i, 1, 1, arm, col, al); bracket(CW - i, i, -1, 1, arm, col, al);
  bracket(i, CH - i, 1, -1, arm, col, al); bracket(CW - i, CH - i, -1, -1, arm, col, al);
  ctx.strokeStyle = rgba(col, 0.22 * a); ctx.lineWidth = 1;
  ctx.beginPath();
  for (const k of [-1, 0, 1]) {                         // registration ticks at each edge's centre
    const l = (k ? 4 : 9) * u, ox = crisp(CW / 2 + k * 10 * u), oy = crisp(CH / 2 + k * 10 * u);
    ctx.moveTo(ox, i); ctx.lineTo(ox, i + l); ctx.moveTo(ox, CH - i); ctx.lineTo(ox, CH - i - l);
    ctx.moveTo(i, oy); ctx.lineTo(i + l, oy); ctx.moveTo(CW - i, oy); ctx.lineTo(CW - i - l, oy);
  }
  ctx.stroke();
}

function drawDepthModule(x, y, u, a) {
  if (a <= 0) return;
  ctx.globalAlpha = a;
  scrim(x + 80 * u, y + 42 * u, 200 * u, 115 * u, 0.9);
  const depth = G.depth, best = HUD.best;
  text('DEPTH', x, y + 4 * u, hfs(11, u), rgba(HT.label, 0.85), 'left', 600, 4);
  const num = String(depth).padStart(2, '0'), ns = Math.round(46 * u);
  glowText(num, x - 3 * u, y + 40 * u, ns, HT.ink, 1, 'left', 200, 1, 16 * u);
  const nx = x + measure(num, ns, 200, 1) + 10 * u;
  text(`−${depth * 40} m`, nx, y + 30 * u, hfs(13, u), rgba(HT.text, 0.92), 'left', 400, 1);
  if (best > 0) {
    const past = depth > best;
    text(past ? 'PAST RECORD' : `RECORD ${String(best).padStart(2, '0')}`, nx, y + 49 * u, hfs(11, u), rgba(HT.exit, past ? 0.7 + 0.3 * Math.sin(G.realTime * 3) : 0.9), 'left', 600, 2);
  }
  // Depth tape: where you are against where you've been
  const n = clamp(Math.max(depth + 4, best + 2), 8, 20), first = Math.max(1, depth + 4 - n + 1);
  const step = 7 * u, ty = crisp(y + 76 * u);
  ctx.lineWidth = 1;
  ctx.strokeStyle = rgba(HT.ink, 0.18);
  ctx.beginPath(); ctx.moveTo(x, ty); ctx.lineTo(x + (n - 1) * step, ty); ctx.stroke();
  for (let k = 0; k < n; k++) {
    const lv = first + k, tx = crisp(x + k * step);
    let h, col = HT.ink, al;
    if (lv < depth) { h = 5; al = 0.6; } else if (lv === depth) { h = 13; al = 1; } else { h = lv % 5 === 0 ? 6 : 3; al = 0.26; }
    if (lv === best && best !== depth) { col = HT.exit; al = 0.95; h = 9; }
    ctx.strokeStyle = rgba(col, al);
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx, ty - h * u); ctx.stroke();
  }
  const mx = x + (depth - first) * step;
  ctx.fillStyle = rgba(HT.ink, 1);
  ctx.beginPath(); ctx.moveTo(mx, ty + 3 * u); ctx.lineTo(mx - 3.5 * u, ty + 8.5 * u); ctx.lineTo(mx + 3.5 * u, ty + 8.5 * u); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawHaulModule(xr, y, u, a) {
  if (a <= 0) return y + 70 * u;
  const p = G.player;
  ctx.globalAlpha = a;
  scrim(xr - 90 * u, y + 46 * u, 210 * u, 125 * u, 0.9);
  text('ECHO SHARDS', xr, y + 4 * u, hfs(11, u), rgba(HT.label, 0.85), 'right', 600, 4);
  const f = HUD.shardFlash, ns = Math.round(34 * u * (1 + 0.14 * easeOut(f)));
  const str = String(G.shards);
  glowText(str, xr, y + 34 * u, ns, HT.shard, 1, 'right', 300, 1, (10 + 20 * f) * u);
  const cw = measure(str, ns, 300, 1);
  drawDiamond(xr - cw - 13 * u, y + 34 * u, 5 * u, HT.shard, 0.9, 0.25 + 0.6 * f);
  // One pip per shard in this cave
  let yy = y + 62 * u;
  const total = L ? L.shards.length : 0, got = G.levelShards;
  if (total) {
    const sp = Math.min(11 * u, 170 * u / total);
    for (let i = 0; i < total; i++) {
      const px = xr - (total - 1 - i) * sp - 3 * u, on = i < got;
      if (on && i === got - 1 && f > 0) {
        ctx.globalAlpha = a * f; ctx.drawImage(SPR.glow, px - 14 * u, yy - 14 * u, 28 * u, 28 * u); ctx.globalAlpha = a;
      }
      drawDiamond(px, yy, 2.6 * u, on ? HT.shard : HT.label, on ? 0.95 : 0.4, on ? 0.85 : 0);
    }
    text(`${got}/${total}`, xr - total * sp - 8 * u, yy + 0.5, hfs(11, u), rgba(HT.label, 0.85), 'right', 500, 1);
  }
  // Flares on hand
  if (p.flares > 0) {
    yy += 24 * u;
    const n = Math.min(p.flares, 6);
    for (let i = 0; i < n; i++) {
      const fx = xr - 3 * u - i * 10 * u;
      ctx.strokeStyle = rgba(HT.flare, 0.9); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(fx, yy + 6 * u); ctx.lineTo(fx, yy - 3 * u); ctx.stroke();
      ctx.fillStyle = rgba([255, 255, 255], 0.95);
      ctx.beginPath(); ctx.arc(fx, yy - 4.5 * u, 1.9 * u, 0, TAU); ctx.fill();
    }
    if (HUD.flareFlash > 0) { ctx.globalAlpha = a * HUD.flareFlash; ctx.drawImage(SPR.flare, xr - 40 * u, yy - 30 * u, 60 * u, 60 * u); ctx.globalAlpha = a; }
    const kx = xr - n * 10 * u - 6 * u;
    const kw = chip('F', kx, yy + 1, hfs(11, u), HT.flare, 0.95, HUD.flareFlash > 0, 'right');
    text(p.flares > 1 ? `FLARES ×${p.flares}` : 'FLARE', kx - kw - 8 * u, yy + 1, hfs(11, u), rgba(HT.label, 0.85), 'right', 600, 3);
  }
  ctx.globalAlpha = 1;
  return yy + 28 * u;
}

function drawContacts(xr, y, u, a) {
  const list = HUD.contacts, p = G.player;
  if (!list.length || a <= 0) return;
  ctx.globalAlpha = a;
  const w = Math.max(200, 214 * u), x0 = xr - w, size = hfs(12, u), rh = Math.max(24 * u, Math.round(hfs(11, u) * 1.7) + 5);
  scrim(xr - w / 2, y + list.length * rh / 2 + 8 * u, w * 0.75, list.length * rh * 0.5 + 34 * u, 0.85);
  text('CONTACTS', xr, y, hfs(11, u), rgba(HT.label, 0.85), 'right', 600, 4);
  const hw = measure('CONTACTS', hfs(11, u), 600, 4);
  ctx.strokeStyle = rgba(HT.ink, 0.2); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, crisp(y)); ctx.lineTo(xr - hw - 10 * u, crisp(y)); ctx.stroke();
  list.forEach((c, i) => {
    const age = G.realTime - c.t0, enter = easeOut(age / 0.22);
    const al = enter * (age > 4.3 ? Math.max(0, 1 - (age - 4.3) / 0.6) : 1);
    if (al <= 0.01) return;
    const slide = (1 - enter) * 14 * u, ry = y + 22 * u + i * rh;
    const col = c.kind === 'exit' ? HT.exit : HT.danger;
    ctx.fillStyle = rgba(col, al);
    ctx.fillRect(Math.round(x0 + slide), Math.round(ry - 6 * u), 2, Math.round(12 * u));
    const name = c.kind === 'exit' ? 'PORTAL' : c.kind.toUpperCase();
    text(name, x0 + 10 * u + slide, ry, size, rgba(col, al), 'left', 600, 2);
    const d = Math.hypot(c.x - p.x, c.y - p.y), rs = `${meters(d)} m`;
    text(rs, xr - 18 * u + slide, ry, size, rgba(HT.text, al), 'right', 400, 1);
    if (c.mark) {
      const tag = c.mark === 'shriek' ? ['SHRIEK', HT.warn, true] : c.mark === '!' ? ['HUNT', col, true] : ['SEEK', col, false];
      chip(tag[0], xr - 18 * u - measure(rs, size, 400, 1) - 8 * u + slide, ry, hfs(11, u), tag[1], al, tag[2], 'right');
    }
    drawArrow(xr - 5 * u + slide, ry, Math.atan2(c.y - p.y, c.x - p.x), 5.5 * u, col, al);   // live bearing to where it echoed
  });
  ctx.globalAlpha = 1;
}

function drawScope(cx, cy, R, u, a) {
  const p = G.player, rt = G.time, hm = hearMulAt(G.depth), charge = p.charging ? p.charge : 0;
  ctx.save();
  ctx.fillStyle = 'rgba(3,10,11,0.74)';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  ctx.fillStyle = rgba(HT.ink, 0.035);
  for (let sy = Math.floor(cy - R); sy < cy + R; sy += 3) ctx.fillRect(cx - R, sy, R * 2, 1);
  ctx.lineWidth = 1;
  ctx.strokeStyle = rgba(HT.ink, 0.1);
  ctx.beginPath();
  for (const k of [1 / 3, 2 / 3]) { ctx.moveTo(cx + R * k, cy); ctx.arc(cx, cy, R * k, 0, TAU); }
  ctx.moveTo(cx - R, crisp(cy)); ctx.lineTo(cx + R, crisp(cy)); ctx.moveTo(crisp(cx), cy - R); ctx.lineTo(crisp(cx), cy + R);
  ctx.stroke();
  // What this ping will reveal (cyan) against how far it will be heard (amber)
  const rr = R * Math.min(1, lerp(CFG.PING_R, CFG.CHARGED_R, charge) / SCOPE_RANGE);
  const hr = R * Math.min(1, lerp(CFG.PING_NOISE, CFG.CHARGED_NOISE, charge) * hm / SCOPE_RANGE);
  ctx.fillStyle = rgba(HT.ink, 0.1 + 0.12 * charge);
  ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgba(HT.ink, 0.8);
  ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.stroke();
  ctx.setLineDash([2 * u, 2.5 * u]); ctx.strokeStyle = rgba(HT.warn, 0.75);
  ctx.beginPath(); ctx.arc(cx, cy, hr, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  if (p.noise > 4) {                                      // the noise you're making right now
    ctx.strokeStyle = rgba(HT.warn, 0.4);
    ctx.beginPath(); ctx.arc(cx, cy, R * Math.min(1, p.noise * hm / SCOPE_RANGE), 0, TAU); ctx.stroke();
  }
  // Sweep only while a ping is ready (the one continuous motion in the HUD)
  if (p.pingCD <= 0 && !charge && !REDUCED_MOTION) {
    const sa = G.realTime * 2.2;
    for (let k = 0; k < 14; k++) {
      ctx.fillStyle = rgba(HT.ink, 0.15 * (1 - k / 14));
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, sa - (k + 1) * 0.055, sa - k * 0.055); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = rgba(HT.ink, 0.65);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(sa) * R, cy + Math.sin(sa) * R); ctx.stroke();
  }
  // Every sonar event in range plays out on the scope at scale
  const sc = R / SCOPE_RANGE;
  for (const pg of G.pings) {
    const r = Math.min(pg.radius, (rt - pg.t0) * pg.speed), f = 1 - r / pg.radius;
    if (r <= 0 || f <= 0) continue;
    const ox = cx + (pg.x - p.x) * sc, oy = cy + (pg.y - p.y) * sc;
    ctx.strokeStyle = rgba(pg.src === 'listener' ? HT.warn : HT.ink, 0.85 * f); ctx.lineWidth = 1.2;
    ctx.beginPath();
    if (pg.half) { ctx.moveTo(ox, oy); ctx.arc(ox, oy, r * sc, pg.ang - pg.half, pg.ang + pg.half); ctx.closePath(); }
    else ctx.arc(ox, oy, r * sc, 0, TAU);
    ctx.stroke();
  }
  for (const sr of G.shockRings) {
    const age = rt - sr.t0, uu = age / 1.4;
    if (uu < 0 || uu > 1) continue;
    ctx.strokeStyle = rgba(HT.danger, 0.8 * (1 - uu)); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx + (sr.x - p.x) * sc, cy + (sr.y - p.y) * sc, (16 + sr.r * (1 - Math.pow(1 - uu, 2.2))) * sc, 0, TAU); ctx.stroke();
  }
  ctx.lineWidth = 1;
  // Echo blips
  for (const g of G.ghosts) {
    const ga = ghostAlpha(g, rt);
    if (ga < 0.05) continue;
    const dx = g.x - p.x, dy = g.y - p.y;
    if (dx * dx + dy * dy > SCOPE_RANGE * SCOPE_RANGE) continue;
    const bx = cx + dx / SCOPE_RANGE * R, by = cy + dy / SCOPE_RANGE * R;
    ctx.globalAlpha = a * ga;
    ctx.drawImage(SPR.red, bx - 7 * u, by - 7 * u, 14 * u, 14 * u);
    ctx.fillStyle = rgba(HT.danger, 1); ctx.fillRect(bx - 1.5, by - 1.5, 3, 3);
    ctx.globalAlpha = a;
  }
  const ex = G.exit, ea = ex ? revealAlpha(ex, rt) : 0;
  if (ea > 0.03) {
    const dx = ex.x - p.x, dy = ex.y - p.y, dl = Math.hypot(dx, dy), k = Math.min(1, dl / SCOPE_RANGE) * R / Math.max(1, dl);
    ctx.globalAlpha = a * Math.min(1, ea);
    drawDiamond(cx + dx * k, cy + dy * k, 2.6 * u, HT.exit, 1, 0.8);
    ctx.globalAlpha = a;
  }
  ctx.restore();
  // Rim and bearing ticks (tinting red while something hunts you)
  const tint = huntTint(), rim = mixCol(HT.ink, HT.danger, tint);
  ctx.lineWidth = 1 + tint;
  ctx.strokeStyle = rgba(rim, 0.5 + 0.35 * tint * (REDUCED_MOTION ? 1 : 0.6 + 0.4 * Math.sin(G.realTime * 8)));
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
  ctx.lineWidth = 1;
  ctx.strokeStyle = rgba(rim, 0.38);
  ctx.beginPath();
  for (let k = 0; k < 48; k++) {
    const an = k / 48 * TAU, l = (k % 12 === 0 ? 5 : k % 4 === 0 ? 3 : 1.5) * u;
    ctx.moveTo(cx + Math.cos(an) * R, cy + Math.sin(an) * R); ctx.lineTo(cx + Math.cos(an) * (R - l), cy + Math.sin(an) * (R - l));
  }
  ctx.stroke();
  // Recovery ring, and the charge ring outside it
  const ready = 1 - clamp(p.pingCD / (p.lastCD || CFG.PING_CD), 0, 1), cr = R + 6 * u;
  ctx.lineWidth = 2;
  ctx.strokeStyle = rgba(HT.ink, 0.13);
  ctx.beginPath(); ctx.arc(cx, cy, cr, 0, TAU); ctx.stroke();
  ctx.strokeStyle = rgba(HT.ink, ready >= 1 ? 0.95 : 0.5);
  ctx.beginPath(); ctx.arc(cx, cy, cr, -Math.PI / 2, -Math.PI / 2 + TAU * ready); ctx.stroke();
  if (HUD.readyFlash > 0) {
    ctx.lineWidth = 7; ctx.strokeStyle = rgba(HT.ink, 0.28 * HUD.readyFlash);
    ctx.beginPath(); ctx.arc(cx, cy, cr, 0, TAU); ctx.stroke();
  }
  if (charge > 0) {
    const kr = R + 12 * u;
    ctx.lineWidth = 2.5; ctx.strokeStyle = rgba(HT.text, 0.55 + 0.45 * charge);
    ctx.beginPath(); ctx.arc(cx, cy, kr, -Math.PI / 2, -Math.PI / 2 + TAU * charge); ctx.stroke();
    ctx.lineWidth = 1; ctx.strokeStyle = rgba(HT.text, 0.5);
    ctx.beginPath();
    for (let q = 1; q < 4; q++) { const an = -Math.PI / 2 + q * Math.PI / 2; ctx.moveTo(cx + Math.cos(an) * (kr - 3 * u), cy + Math.sin(an) * (kr - 3 * u)); ctx.lineTo(cx + Math.cos(an) * (kr + 3 * u), cy + Math.sin(an) * (kr + 3 * u)); }
    ctx.stroke();
  }
  ctx.fillStyle = rgba(HT.text, 1);
  ctx.beginPath(); ctx.arc(cx, cy, 2.2 * u, 0, TAU); ctx.fill();
  ctx.lineWidth = 1;
}

// Hydrophone: a streaming bar trace of your own noise. Newest on the right, history fades left.
function drawTrace(x, y, w, h, u) {
  const n = HUD.noise.length, bw = w / n;
  ctx.fillStyle = 'rgba(3,10,11,0.62)'; ctx.fillRect(x, y, w, h);
  ctx.setLineDash([2, 3]); ctx.lineWidth = 1;
  for (const [v, col] of [[150, HT.warn], [450, HT.danger]]) {
    const ty = crisp(y + h - h * Math.sqrt(v / 1000));
    ctx.strokeStyle = rgba(col, 0.32);
    ctx.beginPath(); ctx.moveTo(x, ty); ctx.lineTo(x + w, ty); ctx.stroke();
  }
  ctx.setLineDash([]);
  for (let i = 0; i < n; i++) {
    const v = HUD.noise[(HUD.noiseI + i) % n];
    if (v < 2) continue;
    const hh = h * Math.sqrt(Math.min(1, v / 1000)), col = v < 150 ? HT.ink : v < 450 ? HT.warn : HT.danger;
    ctx.fillStyle = rgba(col, 0.16 + 0.84 * Math.pow(i / n, 1.6));
    ctx.fillRect(x + i * bw, y + h - hh, Math.max(1, bw - 0.35), hh);
  }
  const cur = G.player.noise, ch = Math.max(1, h * Math.sqrt(Math.min(1, cur / 1000)));
  ctx.fillStyle = rgba(HT.text, 0.95); ctx.fillRect(x + w - 1.5, y + h - ch, 1.5, ch);
  bracketBox(x - 3 * u, y - 3 * u, w + 6 * u, h + 6 * u, 4 * u, HT.ink, 0.4);
}

function drawConsole(x, yb, u, a) {
  HUD.consoleTop = 1e9;
  if (a <= 0) return;
  const p = G.player;
  ctx.globalAlpha = a;
  const R = Math.round(40 * u), cx = x + R + 8 * u, cy = yb - R - 8 * u;
  scrim(cx + 120 * u, cy - 6 * u, 270 * u, 120 * u, 0.95);
  drawScope(cx, cy, R, u, a);
  const rx = cx + R + 26 * u, hm = hearMulAt(G.depth), charge = p.charging ? p.charge : 0, ready = p.pingCD <= 0;
  const lab = hfs(11, u), val = hfs(13, u);
  // Row 1 — sonar state
  const y1 = cy - R + 8 * u;
  text('SONAR', rx, y1, lab, rgba(HT.label, 0.85), 'left', 600, 4);
  const sx = rx + measure('SONAR', lab, 600, 4) + 8 * u;
  if (charge > 0) chip(`CHARGE ${String(Math.round(charge * 100)).padStart(3, ' ')}%`, sx, y1, lab, HT.text, 1, true);
  else if (ready) {
    if (HUD.readyFlash > 0) { ctx.save(); ctx.shadowColor = rgba(HT.ink, HUD.readyFlash); ctx.shadowBlur = 14 * u; chip('READY', sx, y1, lab, HT.ink, 1, true); ctx.restore(); }
    else chip('READY', sx, y1, lab, HT.ink, 1, true);
  } else chip(`RECOVER ${p.pingCD.toFixed(1)}s`, sx, y1, lab, HT.label, 0.9, false);
  // Row 2 — what the next ping will do
  const reach = lerp(CFG.PING_R, CFG.CHARGED_R, charge), heard = lerp(CFG.PING_NOISE, CFG.CHARGED_NOISE, charge) * hm;
  const y2 = cy - 7 * u;
  text('REACH', rx, y2, lab, rgba(HT.label, 0.85), 'left', 600, 2);
  const rv = rx + measure('REACH', lab, 600, 2) + 7 * u;
  text(`${meters(reach)} m`, rv, y2, val, rgba(HT.ink, 1), 'left', 500, 0.5);
  const hx = rv + measure('000 m', val, 500, 0.5) + 14 * u;
  text('HEARD', hx, y2, lab, rgba(HT.label, 0.85), 'left', 600, 2);
  text(`${meters(heard)} m`, hx + measure('HEARD', lab, 600, 2) + 7 * u, y2, val, rgba(HT.warn, 1), 'left', 500, 0.5);
  // Row 3 — hydrophone
  const y3 = cy + 11 * u, tw = Math.max(150, 156 * u), tt = y3 + 10 * u;
  text('HYDROPHONE', rx, y3, lab, rgba(HT.label, 0.85), 'left', 600, 3);
  const n = p.noise;
  const word = n < 4 ? (p.creeping ? 'SILENT' : 'QUIET') : n < 150 ? 'SOFT' : n < 450 ? 'LOUD' : 'DEAFENING';
  const wc = n < 150 ? HT.ink : n < 450 ? HT.warn : HT.danger;
  text(word, rx + tw, y3, lab, rgba(wc, 0.95), 'right', 700, 2);
  drawTrace(rx, tt, tw, cy + R - tt, u);
  // Status tags above the console
  const sy = cy - R - 26 * u;
  HUD.consoleTop = sy - Math.round(lab * 0.85) - 2;
  let tx = x;
  if (p.creeping) tx += chip('CREEPING', tx, sy, lab, HT.ink, 0.95, false) + 8 * u;
  if (G.tension > 0.35) {
    const blink = REDUCED_MOTION ? 1 : 0.6 + 0.4 * Math.sin(G.realTime * (5 + 7 * G.tension));
    chip('● HUNTED', tx, sy, lab, HT.danger, blink, true);
  }
  ctx.globalAlpha = 1;
}

function drawSystemModule(u, a, m) {
  if (a <= 0) return;
  ctx.globalAlpha = a;
  const lab = hfs(11, u), col = Audio.muted ? HT.warn : HT.label, snd = Audio.muted ? 'SOUND OFF' : 'SOUND ON';
  if (CW >= 720) {
    const xr = CW - m, yb = CH - m;
    text('SEED ' + seedLabel(G.runSeed), xr, yb - 4 * u, lab, rgba(HT.label, 0.75), 'right', 500, 2);
    const kw = chip('M', xr, yb - 26 * u, lab, col, 0.85, false, 'right');
    text(snd, xr - kw - 8 * u, yb - 26 * u, lab, rgba(col, 0.8), 'right', 500, 2);
  } else {
    const y = m + 108 * u;
    const kw = chip('M', m, y, lab, col, 0.85, false);
    text(snd, m + kw + 8 * u, y, lab, rgba(col, 0.8), 'left', 500, 2);
    text('SEED ' + seedLabel(G.runSeed), m, y + 22 * u, lab, rgba(HT.label, 0.75), 'left', 500, 2);
  }
  ctx.globalAlpha = 1;
}

// Off-screen echoes: chevrons pinned to the screen edge, pointing at where something echoed
function drawEdgeMarkers(u, a) {
  const p = G.player, pad = 34 * u, rt = G.time;
  const mark = (x, y, col, al, isExit) => {
    const s = worldToScreen(x, y);
    if (s.x > pad && s.x < CW - pad && s.y > pad && s.y < CH - pad) return;
    const dx = s.x - CW / 2, dy = s.y - CH / 2;
    const t = Math.min((CW / 2 - pad) / Math.max(1e-3, Math.abs(dx)), (CH / 2 - pad) / Math.max(1e-3, Math.abs(dy)));
    const ex = CW / 2 + dx * t, ey = CH / 2 + dy * t, ang = Math.atan2(dy, dx);
    ctx.globalAlpha = a * al;
    if (isExit) { ctx.drawImage(SPR.exit, ex - 18 * u, ey - 18 * u, 36 * u, 36 * u); drawDiamond(ex, ey, 5 * u, col, 1, 0.5); }
    else drawArrow(ex, ey, ang, 8 * u, col, 1);
    text(`${meters(Math.hypot(x - p.x, y - p.y))} m`, ex - Math.cos(ang) * 22 * u, ey - Math.sin(ang) * 16 * u, hfs(11, u), rgba(col, 1), 'center', 600, 1);
    ctx.globalAlpha = 1;
  };
  for (const g of G.ghosts) { const ga = ghostAlpha(g, rt); if (ga > 0.1) mark(g.x, g.y, HT.danger, ga, false); }
  if (G.exit) { const ea = revealAlpha(G.exit, rt); if (ea > 0.05) mark(G.exit.x, G.exit.y, HT.exit, Math.min(1, ea), true); }
}

function renderHUD() {
  const p = G.player;
  if (!p) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const u = hudScale();
  const fade = G.state === 'dying' ? Math.max(0, 1 - (G.realTime - G.deathAt) / 0.8) : 1;
  if (fade <= 0) return;
  const stag = (i) => fade * easeOut((HUD.bootT - i * 0.08) / 0.35);   // modules boot up in sequence
  const m = Math.round(30 * u);
  drawScreenFrame(u, stag(0));
  drawEdgeMarkers(u, fade);
  drawDepthModule(m, m, u, stag(1));
  const cy = drawHaulModule(CW - m, m, u, stag(1));
  drawContacts(CW - m, cy, u, stag(2));
  drawConsole(m, CH - m, u, stag(2));
  drawSystemModule(u, stag(3), m);
}

function renderCursor() {
  if (!Input.mouseSeen || G.state !== 'playing') return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const p = G.player, x = Input.mouseX, y = Input.mouseY, ready = p.pingCD <= 0, k = HUD.aimT;
  // Focused-ping cone from the player toward the reticle
  if (k > 0.03 && p.alive) {
    const s = worldToScreen(p.x, p.y), ang = Math.atan2(y - s.y, x - s.x), h = CFG.DIR_HALF, r0 = 16, r1 = 90;
    ctx.fillStyle = rgba(HT.ink, 0.07 * k);
    ctx.beginPath(); ctx.arc(s.x, s.y, r1, ang - h, ang + h); ctx.arc(s.x, s.y, r0, ang + h, ang - h, true); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba(HT.ink, 0.45 * k); ctx.lineWidth = 1;
    ctx.beginPath();
    for (const sg of [-1, 1]) { ctx.moveTo(s.x + Math.cos(ang + sg * h) * r0, s.y + Math.sin(ang + sg * h) * r0); ctx.lineTo(s.x + Math.cos(ang + sg * h) * r1, s.y + Math.sin(ang + sg * h) * r1); }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(s.x, s.y, r1, ang - h, ang + h); ctx.strokeStyle = rgba(HT.ink, 0.3 * k); ctx.stroke();
  }
  // Reticle: four ticks that turn to an X when aiming
  const rot = k * Math.PI / 4, al = ready ? 0.9 : 0.45;
  ctx.strokeStyle = rgba(HT.ink, al); ctx.lineWidth = 1.25;
  ctx.beginPath();
  for (let q = 0; q < 4; q++) { const an = rot + q * Math.PI / 2; ctx.moveTo(x + Math.cos(an) * 5, y + Math.sin(an) * 5); ctx.lineTo(x + Math.cos(an) * 10.5, y + Math.sin(an) * 10.5); }
  ctx.stroke();
  ctx.fillStyle = rgba(HT.text, 0.95); ctx.fillRect(x - 1, y - 1, 2, 2);
  if (!ready) {
    const f = 1 - clamp(p.pingCD / (p.lastCD || CFG.PING_CD), 0, 1);
    ctx.strokeStyle = rgba(HT.ink, 0.55); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 14, -Math.PI / 2, -Math.PI / 2 + TAU * f); ctx.stroke();
  }
  if (p.charging && p.charge > 0) {
    ctx.strokeStyle = rgba(HT.text, 0.6 + 0.4 * p.charge); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 14, -Math.PI / 2, -Math.PI / 2 + TAU * p.charge); ctx.stroke();
  }
  ctx.lineWidth = 1;
}

// Tutorial / intel messages arrive as a framed "SIGNAL" transmission that types itself in
function renderHintPanel(h) {
  const u = uiScale(), t = h.t;
  const a = t < 0.3 ? easeOut(t / 0.3) : t > h.dur ? Math.max(0, 1 - (t - h.dur) / 0.35) : 1;
  if (a <= 0) return;
  const size = Math.max(12, Math.round(13.5 * u)), maxW = Math.min(CW - 72, 540 * u);
  const lines = wrapLines(h.str, size, maxW, 0.3), lh = Math.round(size * 1.55);
  const padX = Math.round(18 * u), padY = Math.round(14 * u), head = Math.round(20 * u);
  const bw = Math.round(Math.max(...lines.map((l) => measure(l, size, 400, 0.3))) + padX * 2);
  const bh = head + lines.length * lh + padY * 2 - Math.round(lh * 0.3);
  const bottom = Math.min(CH - 168 * u, HUD.consoleTop - 14 * u);
  const bx = Math.round(CW / 2 - bw / 2), by = Math.round(bottom - bh + (1 - a) * 8 * u);
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(3,9,10,0.78)'; ctx.fillRect(bx, by, bw, bh);
  bracketBox(bx, by, bw, bh, 10 * u, HT.ink, 0.6);
  const typing = !REDUCED_MOTION && t * 62 < h.str.length;
  text('SIGNAL', bx + padX, by + padY + 2, hfs(11, u), rgba(HT.ink, 0.85), 'left', 700, 4);
  const dotOn = typing ? Math.sin(G.realTime * 18) > 0 : true;
  ctx.fillStyle = rgba(HT.ink, dotOn ? 0.9 : 0.25);
  ctx.fillRect(bx + padX + measure('SIGNAL', hfs(11, u), 700, 4) + 4 * u, by + padY - 1, 4, 4);
  let left = REDUCED_MOTION ? Infinity : Math.floor(t * 62);
  let caretX = 0, caretY = 0;
  lines.forEach((ln, i) => {
    const ly = by + padY + head + i * lh + lh * 0.35;
    const shown = ln.slice(0, Math.max(0, left));
    left -= ln.length + 1;
    if (!shown) return;
    text(shown, bx + padX, ly, size, rgba(HT.text, 0.95), 'left', 400, 0.3);
    caretX = bx + padX + measure(shown, size, 400, 0.3) + 2; caretY = ly;
  });
  if (typing && caretX) { ctx.fillStyle = rgba(HT.ink, 0.85); ctx.fillRect(caretX, caretY - size * 0.45, Math.max(2, size * 0.5), size * 0.9); }
  ctx.globalAlpha = 1;
}

function worldToScreen(x, y) { return { x: (x - G.cam.x) * ZOOM + CW / 2, y: (y - G.cam.y) * ZOOM + CH / 2 }; }

function renderPause() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const u = uiScale();
  ctx.fillStyle = 'rgba(2,4,5,0.72)'; ctx.fillRect(0, 0, CW, CH);
  text('PAUSED', CW / 2, CH * 0.24, Math.round(26 * u), 'rgba(225,255,250,0.92)', 'center', 300, 14 * u);
  text(`DEPTH ${String(G.depth).padStart(2, '0')}  ·  ${G.shards} SHARDS  ·  SEED ${seedLabel(G.runSeed)}`, CW / 2, CH * 0.24 + 36 * u, Math.round(11 * u), 'rgba(190,225,222,0.55)', 'center', 400, 2);
  drawKeyList(CW / 2, CH * 0.24 + 92 * u, u, 1);
  text('ESC  RESUME   ·   M  MUTE   ·   Q  QUIT TO TITLE', CW / 2, Math.min(CH - 50 * u, CH * 0.24 + 92 * u + 7 * 11.5 * u * 1.95 + 34 * u), Math.round(11.5 * u), 'rgba(95,245,228,0.8)', 'center', 500, 3);
}

function renderDeath() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const u = uiScale(), t = G.realTime - G.deathAt - 1.6;
  const a = smoothstep(clamp(t / 0.8, 0, 1));
  ctx.fillStyle = `rgba(2,4,5,${0.7 * a})`; ctx.fillRect(0, 0, CW, CH);
  const et = buildEchoText('SILENCED');
  const w = Math.min(CW * 0.74, 620 * u), h = w * et.h / et.w;
  const ty = Math.max(24 * u + h / 2, CH / 2 - (h + 300 * u) / 2 + h / 2);
  const rings = periodicRings(et, t, 3.2, [[0, 0], [-0.6, 0.3], [0.6, -0.3]], 0);
  drawEchoText(et, CW / 2, ty, w, t, { rings, base: 0.16, color: [255, 96, 72], alpha: a, showRings: true });
  let y = ty + h / 2 + 32 * u;
  text(G.deathLine || '', CW / 2, y, Math.round(13 * u), `rgba(255,190,170,${0.8 * a})`, 'center', 400, 1);

  const a2 = smoothstep(clamp((t - 0.4) / 0.8, 0, 1));
  y += 64 * u;
  const cols = [['DEPTH', String(G.depth).padStart(2, '0')], ['SHARDS', String(G.shards)], ['PINGS', String(G.pingCount || 0)]];
  const spread = Math.min(150 * u, CW / 3.4);
  cols.forEach(([k, v], i) => {
    const x = CW / 2 + (i - 1) * spread;
    text(k, x, y, Math.round(10 * u), `rgba(190,225,222,${0.5 * a2})`, 'center', 500, 3);
    text(v, x, y + 28 * u, Math.round(28 * u), `rgba(225,255,250,${0.92 * a2})`, 'center', 300, 1);
  });
  y += 76 * u;
  const b = G.best;
  if (G.newBest) text('NEW DEEPEST RUN', CW / 2, y, Math.round(11.5 * u), `rgba(178,140,255,${(0.7 + 0.3 * Math.sin(G.realTime * 3)) * a2})`, 'center', 600, 5);
  else if (b) text(`DEEPEST  ${String(b.depth).padStart(2, '0')}  ·  ${b.shards} SHARDS`, CW / 2, y, Math.round(11 * u), `rgba(178,140,255,${0.75 * a2})`, 'center', 500, 3);

  const a3 = smoothstep(clamp((t - 0.9) / 0.8, 0, 1));
  y = Math.min(CH - 60 * u, y + 64 * u);
  const opts = [['R', 'descend again (or click)'], ['T', 'retry seed ' + seedLabel(G.runSeed)], ['ESC', 'title']];
  const size = Math.round(11.5 * u);
  const widths = opts.map(([k, v]) => measure(k, size, 700, 2) + 10 * u + measure(v, size, 400, 1));
  const gap = 34 * u, total = widths.reduce((s, x) => s + x, 0) + gap * (opts.length - 1);
  if (total < CW - 32) {
    let x = CW / 2 - total / 2;
    opts.forEach(([k, v], i) => {
      text(k, x, y, size, `rgba(95,245,228,${0.95 * a3})`, 'left', 700, 2);
      text(v, x + measure(k, size, 700, 2) + 10 * u, y, size, `rgba(190,225,222,${0.7 * a3})`, 'left', 400, 1);
      x += widths[i] + gap;
    });
  } else {
    opts.forEach(([k, v], i) => text(`${k}  ${v}`, CW / 2, y - 20 * u + i * 20 * u, size, `rgba(95,245,228,${0.9 * a3})`, 'center', 500, 1));
  }
}

function renderDescent() {
  const t = G.descendT;
  if (t < 0.9 && G.descendFrom && !G.descendLoaded) {
    // The portal takes you: a violet-white ring swallows the screen
    renderWorld(1); renderPost();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const k = t / 0.9, s = worldToScreen(G.descendFrom.x, G.descendFrom.y), R = Math.hypot(CW, CH) * 1.1 * k * k;
    ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(1, R), 0, TAU);
    ctx.fillStyle = `rgba(20,12,40,${0.5 * k})`; ctx.fill();
    ctx.strokeStyle = `rgba(215,195,255,${1 - k * 0.6})`; ctx.lineWidth = 2 + 10 * k; ctx.stroke();
    ctx.fillStyle = `rgba(2,4,5,${Math.pow(k, 1.6)})`; ctx.fillRect(0, 0, CW, CH);
    return;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const u = uiScale(), tt = t - 0.9;
  const a = clamp(tt / 0.3, 0, 1) * clamp((1.85 - tt) / 0.45, 0, 1);
  const label = 'DEPTH ' + String(G.pendingDepth).padStart(2, '0');
  const et = buildEchoText(label);
  const w = Math.min(CW * 0.6, 460 * u), h = w * et.h / et.w;
  drawEchoText(et, CW / 2, CH * 0.44, w, tt, { rings: [{ t0: 0.05, x: et.cx - et.w * 0.62, y: et.cy }], base: 0.05, alpha: a, decay: 2.2, showRings: true });
  text(`−${G.pendingDepth * 40} m`, CW / 2, CH * 0.44 + h / 2 + 30 * u, Math.round(11 * u), `rgba(190,225,222,${0.6 * a})`, 'center', 400, 4);
  const cc = creatureCounts(G.pendingDepth), bits = [];
  if (cc.crawler) bits.push(`${cc.crawler} CRAWLER${cc.crawler > 1 ? 'S' : ''}`);
  if (cc.stalker) bits.push(`${cc.stalker} STALKER${cc.stalker > 1 ? 'S' : ''}`);
  if (cc.listener) bits.push(`${cc.listener} LISTENER${cc.listener > 1 ? 'S' : ''}`);
  text(bits.join('  ·  '), CW / 2, CH * 0.44 + h / 2 + 54 * u, Math.round(10 * u), `rgba(255,120,90,${0.55 * a})`, 'center', 500, 3);
}

function render(alpha) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const s = G.state;
  if (s === 'title') { renderWorld(alpha); renderPost(); renderTitle(); }
  else if (s === 'descending') renderDescent();
  else {
    renderWorld(alpha); renderPost();
    if (s === 'dead') renderDeath();
    else { renderHUD(); if (s === 'paused') renderPause(); else { Hints.render(); renderCursor(); } }
  }
  if (G.fadeIn > 0.005) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = `rgba(2,4,5,${Math.pow(G.fadeIn, 1.4)})`; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

// — Input —
const GAME_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab']);
const MODIFIERS = new Set(['ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight', 'AltLeft', 'AltRight', 'MetaLeft', 'MetaRight', 'CapsLock', 'Tab', 'KeyM']);
// Some keyboards / layouts report an empty or odd e.code; fall back to e.key for the essentials.
function keyCode(e) {
  if (e.code) return e.code;
  const k = e.key || '';
  if (k === ' ' || k === 'Spacebar') return 'Space';
  if (k === 'Escape' || k === 'Esc') return 'Escape';
  if (k.startsWith('Arrow') || k === 'Enter' || k === 'Shift' || k === 'Tab') return k === 'Shift' ? 'ShiftLeft' : k;
  if (k.length === 1 && /[a-z]/i.test(k)) return 'Key' + k.toUpperCase();
  return k;
}
function onKeyDown(e) {
  const code = keyCode(e);
  if (GAME_KEYS.has(code)) e.preventDefault();
  // Ctrl is a creep key: keep Ctrl+S / Ctrl+D etc. from opening browser dialogs mid-game
  if (e.ctrlKey && G.state === 'playing' && /^Key[WASDCF]$/.test(code)) e.preventDefault();
  Audio.init();
  if (e.repeat) return;
  Input.keys.add(code);
  if (code === 'KeyM') { Audio.setMuted(!Audio.muted); return; }
  switch (G.state) {
    case 'title':
      if (!MODIFIERS.has(code) && !e.metaKey && !e.ctrlKey && !/^F\d+$/.test(code)) startRun(randomSeed());
      break;
    case 'playing':
      if (code === 'Escape' || code === 'KeyP') pauseGame();
      else if (code === 'Space') {
        if (Input.shift()) Input.dirPing = true;
        else if (!Input.pingHeld) { Input.pingHeld = true; G.player.holdT = 0; }
      } else if (code === 'KeyF') placeFlare();
      break;
    case 'paused':
      if (code === 'Escape' || code === 'KeyP') resumeGame();
      else if (code === 'KeyQ') { Audio.resume(); setupTitle(); }
      break;
    case 'dead':
      if (G.realTime - G.deathAt < 2.1) break;               // don't let a panicked keypress skip the screen
      if (code === 'KeyR' || code === 'Enter') startRun(randomSeed());
      else if (code === 'KeyT') startRun(G.runSeed);
      else if (code === 'Escape') setupTitle();
      break;
    case 'descending':
      if (G.descendLoaded && G.descendT > 1.3 && G.descendT < 2.45) G.descendT = 2.45;
      break;
  }
}
function onKeyUp(e) {
  const code = keyCode(e);
  Input.keys.delete(code);
  if (code === 'Space' && Input.pingHeld && !Input.mouseL) { Input.pingHeld = false; if (G.state === 'playing') Input.pingReleased = true; }
}
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
window.addEventListener('blur', () => {
  Input.reset(); Input.mouseL = false;
  if (G.player && G.state === 'playing') { G.player.charging = false; G.player.charge = 0; }
  pauseGame();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pauseGame(); Audio.suspend(); }
  else if (G.state !== 'paused') Audio.resume();
});
window.addEventListener('beforeunload', (e) => { if (G.state === 'playing') { e.preventDefault(); e.returnValue = ''; } });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointermove', (e) => { Input.mouseX = e.clientX; Input.mouseY = e.clientY; Input.mouseSeen = true; });
canvas.addEventListener('pointerdown', (e) => {
  Input.mouseX = e.clientX; Input.mouseY = e.clientY; Input.mouseSeen = true;
  canvas.focus();
  Audio.init();
  if (G.state === 'title') { startRun(randomSeed()); return; }
  if (G.state === 'paused') { resumeGame(); return; }
  if (G.state === 'dead' && G.realTime - G.deathAt > 2.6 && e.button === 0) { startRun(randomSeed()); return; }
  if (G.state !== 'playing') return;
  if (e.button === 2 || (e.button === 0 && Input.shift())) Input.dirPing = true;
  else if (e.button === 0 && !Input.pingHeld) { Input.mouseL = true; Input.pingHeld = true; G.player.holdT = 0; }
});
window.addEventListener('pointerup', (e) => {
  if (e.button !== 0 || !Input.mouseL) return;
  Input.mouseL = false;
  if (Input.pingHeld && !Input.keys.has('Space')) { Input.pingHeld = false; if (G.state === 'playing') Input.pingReleased = true; }
});

/* ═══════════════════════════ 12. MAIN LOOP ═══════════════════════════ */
// Fixed 60 Hz simulation on an accumulator (scaled by slow-motion), rendered with interpolation.
const SIM_STATES = new Set(['playing', 'dying', 'dead']);
let lastFrame = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.25) dt = 0.25;
  G.realTime += dt;
  G.shake *= Math.exp(-7 * dt);
  G.flash *= Math.exp(-3 * dt);
  G.fadeIn = Math.max(0, (G.fadeIn || 0) - dt * 1.5);
  if (G.slowTimer > 0) G.slowTimer -= dt;
  const targetScale = G.slowTimer > 0 ? (G.state === 'dying' ? 0.22 : 0.3) : 1;
  G.timeScale += (targetScale - G.timeScale) * Math.min(1, dt * (targetScale < G.timeScale ? 18 : 5));

  let alpha = 1;
  if (G.state === 'title') {
    acc += dt;
    let steps = 0;
    while (acc >= CFG.STEP && steps < 8 && G.state === 'title') { updateTitle(CFG.STEP); acc -= CFG.STEP; steps++; }
    if (steps >= 8) acc = 0;
    alpha = acc / CFG.STEP;
  } else if (SIM_STATES.has(G.state)) {
    acc += dt * G.timeScale;
    let steps = 0;
    while (acc >= CFG.STEP && steps < 12 && SIM_STATES.has(G.state)) {
      savePrevPositions();
      updateWorld(CFG.STEP);
      acc -= CFG.STEP; steps++;
    }
    if (steps >= 12 || !SIM_STATES.has(G.state)) acc = 0;
    alpha = acc / CFG.STEP;
    if (G.state === 'dying' && G.realTime - G.deathAt > 1.6) { G.state = 'dead'; setCursor(true); }
  } else if (G.state === 'descending') updateDescent(dt);

  if (G.state === 'playing') { Hints.update(dt); Tut.update(dt); }
  if (G.state === 'playing' || G.state === 'dying') HUD.update(dt);
  Audio.update(dt);
  render(alpha);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
setupTitle();
requestAnimationFrame(frame);
</script>
</body>
