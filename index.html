<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kenzo Studios</title>
<meta name="description" content="Agents, applications, games, presentations, skills and websites, designed and built by Kenzo Studios.">
<meta property="og:title" content="Kenzo Studios">
<meta property="og:description" content="Agents, applications, games, presentations, skills and websites, designed and built by Kenzo Studios.">
<meta property="og:image" content="https://kenzostudios.github.io/games/iron-frontier/shots/title.webp">
<meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0d18" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Cobalt Condensed: Bento Index layout. Giant condensed wordmark, a bento of the six sections,
   then one section per category: condensed header over its own bento. Sharp corners, hairline tiles. */
:root{
  --bg:#eef0f4; --tile:#ffffff; --edge:#d7dbe6; --fg:#0d1330; --muted:#5b6380;
  --cobalt:#2443ff; --on-cobalt:#ffffff; --cobalt-muted:#c3ccff; --cobalt-line:rgb(255 255 255 / .2);
  --accent:#2443ff; --pattern:rgb(36 67 255 / .09); --shade:rgb(13 19 48 / .55);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:4px; --gap:clamp(8px,1vw,14px); --side:clamp(16px,3vw,44px);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0d18; --tile:#121729; --edge:#232a45; --fg:#eef0f8; --muted:#98a0bd;
  --cobalt:#2f4dff; --on-cobalt:#ffffff; --cobalt-muted:#c3ccff; --accent:#8496ff; --pattern:rgb(132 150 255 / .1); --shade:rgb(0 0 0 / .7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0d18; --tile:#121729; --edge:#232a45; --fg:#eef0f8; --muted:#98a0bd;
  --cobalt:#2f4dff; --on-cobalt:#ffffff; --cobalt-muted:#c3ccff; --accent:#8496ff; --pattern:rgb(132 150 255 / .1); --shade:rgb(0 0 0 / .7);
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}

/* Nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.brand{font:850 15px/1 var(--f-display);font-variation-settings:"wdth" 125;letter-spacing:.03em;white-space:nowrap}
.pills{display:flex;gap:2px;padding:4px;margin:0;list-style:none;background:var(--tile);border:1px solid var(--edge);border-radius:var(--r)}
.pills a{display:block;padding:6px 12px;border-radius:2px;font-size:14px;color:var(--muted);transition:background-color .2s,color .2s}
.pills a:hover,.pills a[aria-current="true"]{background:var(--cobalt);color:var(--on-cobalt)}
.cta{display:inline-flex;align-items:center;padding:10px 16px;border-radius:var(--r);background:var(--cobalt);color:var(--on-cobalt);font-weight:600;font-size:14px;white-space:nowrap;transition:transform .15s}
.cta:active{transform:translateY(1px)}

/* Hero */
.hero h1{margin:clamp(24px,4vw,56px) 0 0;font:900 clamp(92px,21vw,320px)/.78 var(--f-display);font-variation-settings:"wdth" 62;letter-spacing:-.02em;text-transform:uppercase}
.hero h1 span{display:block;overflow:hidden;padding-bottom:.04em}
.hero h1 em{font-style:normal;display:inline-block;animation:rise 1.1s var(--ease) both}
.hero h1 span+span em{animation-delay:.1s}
.hero h1 b{color:var(--accent)}
.hx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px 40px;margin:clamp(18px,2.4vw,32px) 0 clamp(24px,3vw,40px)}
.hx p{margin:0;max-width:44ch;font-size:clamp(17px,1.6vw,22px);line-height:1.4;text-wrap:pretty}
.hx .links{display:flex;gap:18px;font:500 14px var(--f-mono);color:var(--muted)}
.hx .links a:hover{color:var(--accent)}

/* Bento */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(150px,15vw,230px);gap:var(--gap);grid-auto-flow:dense}
.tile{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;padding:clamp(14px,1.4vw,20px);background:var(--tile);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;transition:border-color .25s;animation:fade .8s var(--ease) both}
.tile:hover{border-color:var(--accent)}
.tile .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tile .n{font:850 clamp(22px,2.6vw,38px)/.9 var(--f-display);font-variation-settings:"wdth" 70;letter-spacing:-.01em;text-transform:uppercase;transition:color .25s}
.tile.xl .n{font-size:clamp(34px,4.8vw,72px)}
.tile:hover .n{color:var(--accent)}
.tile .c{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.tile p{margin:0;font-size:14px;color:var(--muted);line-height:1.5;max-width:48ch}
.fr{flex:1;min-height:0;border-radius:2px;overflow:hidden;position:relative}
.fr img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;transition:transform .7s var(--ease)}
.tile:hover .fr img{transform:scale(1.05)}
.soon{flex:1;min-height:0;border-radius:2px;display:flex;align-items:flex-end;padding:12px;font:500 12px var(--f-mono);color:var(--muted);background:repeating-linear-gradient(-45deg,var(--pattern) 0 1px,transparent 1px 10px)}
.go{position:absolute;right:clamp(14px,1.4vw,20px);bottom:clamp(14px,1.4vw,20px);width:38px;height:38px;border-radius:var(--r);background:var(--cobalt);color:var(--on-cobalt);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .25s,transform .4s var(--ease)}
.go svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.tile:hover .go,.tile:focus-visible .go{opacity:1;transform:none}
.tile.ink{background:var(--cobalt);color:var(--on-cobalt);border-color:transparent}
.tile.ink .c{color:var(--cobalt-muted)}
.tile.ink:hover .n{color:var(--on-cobalt)}
.tile.ink ul{margin:auto 0 0;padding:0;list-style:none;display:grid;gap:6px;font:700 clamp(15px,1.5vw,20px)/1.2 var(--f-display);font-variation-settings:"wdth" 80}
.tile.ink li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--cobalt-line);padding-top:6px}
.tile.ink li span{font:400 12px var(--f-mono);color:var(--cobalt-muted)}
.tile.ink .go{background:var(--on-cobalt);color:var(--cobalt)}
.w2{grid-column:span 2}.w4{grid-column:span 4}.h2{grid-row:span 2}

/* Sections */
.sec{margin-top:clamp(72px,9vw,140px)}
.sh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px 40px;border-top:2px solid var(--fg);padding-top:16px;margin-bottom:var(--gap)}
.sh h2{margin:0;font:850 clamp(64px,9.5vw,150px)/.8 var(--f-display);font-variation-settings:"wdth" 62;letter-spacing:-.02em;text-transform:uppercase}
.sh p{margin:0;max-width:40ch;color:var(--muted);text-align:right;text-wrap:pretty}
.sec .bento{grid-auto-rows:clamp(170px,17vw,250px)}
.tile.empty{cursor:default;grid-row:span 1}
.tile.empty:hover{border-color:var(--edge)}
.tile.empty .n{font-size:clamp(20px,2vw,28px)}
.tile.empty:hover .n{color:inherit}

/* Footer */
footer{margin:clamp(80px,10vw,160px) 0 0;padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
.contact{background:var(--cobalt);color:var(--on-cobalt);border-radius:var(--r);padding:clamp(24px,3vw,44px)}
.contact h2{margin:0;font:900 clamp(80px,17vw,260px)/.8 var(--f-display);font-variation-settings:"wdth" 62;letter-spacing:-.02em;text-transform:uppercase}
.contact .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;margin-top:clamp(20px,3vw,40px);font:500 14px var(--f-mono);color:var(--cobalt-muted)}
.contact .row nav{display:flex;flex-wrap:wrap;gap:20px}
.contact .row a{color:var(--on-cobalt);border-bottom:1px solid var(--cobalt-line);transition:border-color .2s}
.contact .row a:hover{border-color:var(--on-cobalt)}

/* Project panel */
dialog{width:min(1200px,calc(100vw - 2 * var(--side)));max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--edge);border-radius:var(--r);background:var(--tile);color:var(--fg);overflow:auto}
dialog::backdrop{background:var(--shade);backdrop-filter:blur(4px)}
dialog[open]{animation:pop .45s var(--ease)}
.pd{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.pd .media{background:#0d0a14;display:flex;flex-direction:column;min-width:0}
.pd .main{aspect-ratio:16/9;width:100%;height:auto;object-fit:cover;image-rendering:pixelated}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:6px}
.thumbs button{all:unset;cursor:pointer;border-radius:2px;overflow:hidden;opacity:.55;outline:2px solid transparent;outline-offset:-2px;transition:opacity .15s}
.thumbs button:hover{opacity:.9}
.thumbs button[aria-pressed="true"]{opacity:1;outline-color:#8496ff}
.thumbs button:focus-visible{opacity:1;outline-color:#8496ff}
.thumbs img{aspect-ratio:16/9;width:100%;object-fit:cover;image-rendering:pixelated}
.cap{margin:0;padding:2px 12px 12px;font:400 12px/1.4 var(--f-mono);color:#b5b0c8;min-height:2.8em}
.pd .info{padding:clamp(20px,2.6vw,36px);display:flex;flex-direction:column;gap:18px;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:500 11px/1 var(--f-mono);letter-spacing:.04em;padding:6px 8px;border:1px solid var(--edge);border-radius:2px;color:var(--muted)}
.tags span:first-child{background:var(--cobalt);color:var(--on-cobalt);border-color:transparent}
.pd h3{margin:0;font:900 clamp(44px,5vw,76px)/.85 var(--f-display);font-variation-settings:"wdth" 62;text-transform:uppercase}
.pd h3 small{display:block;margin-top:8px;font:600 15px var(--f-body);text-transform:none;color:var(--accent)}
.pd .info>p{margin:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:14px}
.facts dt{font:500 12px/1.9 var(--f-mono);color:var(--muted)}
.facts dd{margin:0;min-width:0}
.acts{display:grid;gap:8px;margin-top:auto}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--edge);border-radius:var(--r);transition:border-color .15s,transform .12s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn b{display:block;font-weight:600;font-size:15px;line-height:1.2}
.btn span{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-top:3px}
.btn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt)}
.btn.primary span{color:var(--cobalt-muted)}
.controls{grid-column:1/-1;border-top:1px solid var(--edge);padding:16px clamp(20px,2.6vw,36px);display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.controls h4{margin:0;font:500 12px var(--f-mono);color:var(--muted)}
.controls ul{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0;padding:0;list-style:none;font-size:13px}
.controls li{display:flex;align-items:center;gap:6px}
kbd{font:500 11px/1 var(--f-mono);min-width:24px;text-align:center;padding:5px 6px 4px;border-radius:3px;background:var(--bg);border:1px solid var(--edge);border-bottom-width:2px}
.close{position:sticky;top:0;float:right;z-index:2;margin:10px 10px -48px 0;width:38px;height:38px;border-radius:var(--r);border:1px solid var(--edge);background:var(--tile);cursor:pointer;display:grid;place-items:center}
.close svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}

@keyframes rise{from{transform:translateY(105%)}}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

@media (max-width:1100px){.pills{display:none}}
@media (max-width:900px){
  .pd{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(150px,42vw,220px)}
  .sec .bento{grid-auto-rows:clamp(160px,46vw,240px)}
  .w4,.tile.xl{grid-column:span 2}
  .sh p{text-align:left}
  .facts{grid-template-columns:minmax(0,1fr);gap:2px}
  .facts dd{margin-bottom:8px}
}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="#top">KENZO STUDIOS</a>
    <ul class="pills" id="pills"></ul>
    <a class="cta" href="#contact">Contact</a>
  </div>
</header>

<main id="top" class="wrap">
  <section class="hero" aria-labelledby="hero-title">
    <h1 id="hero-title"><span><em>Kenzo</em></span><span><em>Studios<b>.</b></em></span></h1>
    <div class="hx">
      <p>Agents, applications, games, presentations, skills and websites, designed and built end to end.</p>
      <div class="links" id="hero-links"></div>
    </div>
    <nav class="bento" id="home-bento" aria-label="Sections"></nav>
  </section>

  <div id="sections"></div>
  <noscript><p>This site needs JavaScript to show projects. You can still <a href="games/iron-frontier/play.html">play Iron Frontier</a>.</p></noscript>
</main>

<footer class="wrap" id="contact">
  <div class="contact">
    <h2>Contact</h2>
    <div class="row"><nav id="contact-links" aria-label="Contact links"></nav><span>&copy; <span id="year">2026</span> Kenzo Studios</span></div>
  </div>
</footer>

<dialog id="panel" aria-labelledby="pd-title"></dialog>

<script>
/* ============================================================
   CONTENT. Edit this block to update the site.
   - Leave a link empty ("") to hide it.
   - Add a project by adding an object to PROJECTS with a matching `section`.
   - Sections always show in alphabetical order.
   ============================================================ */
const SITE = {
  github: "https://github.com/KenzoStudios",
  linkedin: "",   // e.g. "https://www.linkedin.com/in/your-handle"
  email: ""       // e.g. "hello@yourdomain.com"
};

const SECTIONS = [
  { id: "agents",        name: "Agents",        blurb: "AI agents built with Claude Code, each with a recording of a real run and the source.", soon: "First agents land soon, each with a recording of a real task and a link to the code." },
  { id: "applications",  name: "Applications",  blurb: "Desktop apps for Mac and Windows, with demo videos and downloads.", soon: "Desktop apps are on their way, each with a short demo video and a download.", alias: "apps" },
  { id: "games",         name: "Games",         blurb: "Games that run in the browser. No download, no install.", soon: "More games are in production." },
  { id: "presentations", name: "Presentations", blurb: "Decks and talks you can page through in the browser.", soon: "Decks and talks are on their way." },
  { id: "skills",        name: "Skills",        blurb: "Claude skills written to automate design, writing and research work.", soon: "Skills are being written up with examples of what each one produces." },
  { id: "websites",      name: "Websites",      blurb: "Sites in HTML, CSS and JavaScript. Each one opens as a live page.", soon: "Sample websites are on their way, each one a live page you can click through." }
];

const PROJECTS = [
  {
    id: "iron-frontier", section: "games",
    title: "Iron Frontier", subtitle: "Legion Rising",
    summary: "A pixel-art roguelite run-and-gun with weapon fusions and a boss at the bottom of every zone.",
    body: "Fight down through sector after sector of the Legion's territory, pick up and fuse new guns as you go, and take on a boss at the bottom of each zone. Die and you start a fresh run, keeping the intel you collected to unlock more for next time.",
    tags: ["Game", "JavaScript", "WebGL", "Vite"],
    cover: "games/iron-frontier/shots/title.webp",
    shots: [
      { src: "games/iron-frontier/shots/title.webp",   alt: "Iron Frontier title screen: a soldier by a campfire on a desert ridge at sunset", cap: "Title screen. Every sprite, tile and font glyph is drawn in code." },
      { src: "games/iron-frontier/shots/range.webp",   alt: "Training range with targets and signposts explaining aim, reload and parry", cap: "The opening climb teaches each move on signposts: aim, reload, parry." },
      { src: "games/iron-frontier/shots/outpost.webp", alt: "The outpost hub: a lit bunker with a terminal and a field desk", cap: "The outpost is the hub between runs: terminal, field desk and trophy wall." },
      { src: "games/iron-frontier/shots/armoury.webp", alt: "The armoury: weapon racks and a map table outside the outpost", cap: "The armoury holds every gun you have found and what each one does." },
      { src: "games/iron-frontier/shots/firing.webp",  alt: "The soldier firing on the test range beside the armoury", cap: "Test any gun you own on the range before heading down." }
    ],
    facts: [
      ["Zones", "Ashen Zone, Black Jungle, The Drowned Works, Rust Spires, Iron Citadel"],
      ["Modes", "Full runs, a Daily Operation with a shared seed, and The Spiral (endless)"],
      ["Extras", "Weapon fusions and evolutions, a codex of enemies and lore, a trophy wall, rebindable keys, colour-blind palettes"],
      ["Plays on", "Keyboard and mouse, gamepad or touch screen"]
    ],
    actions: [
      { label: "Play from the start", note: "A fresh save, beginning with the tutorial climb.", href: "games/iron-frontier/play.html", primary: true },
      { label: "Play with everything unlocked", note: "Skips the tutorial and opens every upgrade, achievement and codex entry.", href: "games/iron-frontier/play-unlocked.html" }
    ],
    controls: [[["A","D"],"Move"],[["Space"],"Jump"],[["Mouse"],"Aim and fire"],[["Shift"],"Dash"],[["R"],"Reload"],[["F"],"Parry"],[["G"],"Throw"],[["E"],"Interact"]]
  }
];

/* ============================================================
   RENDERING. No need to edit below this line.
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ARROW = '<span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>';
const bySec = id => PROJECTS.filter(p => p.section === id);
const count = n => String(n).padStart(2, "0");

const links = [
  SITE.github && { href: SITE.github, label: "GitHub", ext: true },
  SITE.linkedin && { href: SITE.linkedin, label: "LinkedIn", ext: true },
  SITE.email && { href: "mailto:" + SITE.email, label: SITE.email }
].filter(Boolean);
const linkHTML = links.map(l => `<a href="${esc(l.href)}"${l.ext ? ' target="_blank" rel="noopener"' : ""}>${esc(l.label)}</a>`).join("");
$("#hero-links").innerHTML = linkHTML;
$("#contact-links").innerHTML = linkHTML;
$("#year").textContent = new Date().getFullYear();

$("#pills").innerHTML = SECTIONS.map(s => `<li><a href="#${s.id}">${s.name}</a></li>`).join("");

/* Home bento: Agents big, Games tall, Skills as a cobalt list, Websites wide */
const HOME_SIZE = { agents: "w2 h2 xl", applications: "", games: "h2", presentations: "", skills: "w2 ink", websites: "w2" };
$("#home-bento").innerHTML = SECTIONS.map((s, i) => {
  const items = bySec(s.id), size = HOME_SIZE[s.id] || "";
  const delay = `style="animation-delay:${(i * 0.06).toFixed(2)}s"`;
  const head = `<span class="top"><span class="n">${s.name}</span><span class="c">${count(items.length)}</span></span>`;
  if (size.includes("ink")) {
    const list = items.length
      ? items.slice(0, 4).map(p => `<li>${esc(p.title)}<span>${esc(p.tags?.[0] || "")}</span></li>`).join("")
      : `<li>In progress<span>Soon</span></li>`;
    return `<a class="tile ${size}" href="#${s.id}" ${delay}>${head}<ul>${list}</ul>${ARROW}</a>`;
  }
  const cover = items.find(p => p.cover);
  const media = cover
    ? `<span class="fr"><img src="${esc(cover.cover)}" alt="" loading="lazy" width="960" height="540"></span>`
    : `<span class="soon">In progress</span>`;
  return `<a class="tile ${size}" href="#${s.id}" ${delay}>${head}${media}${ARROW}</a>`;
}).join("");

/* Sections */
const ITEM_SIZE = (i, n) => i === 0 ? "w2 h2 xl" : (i <= 2 ? "w2" : ((n - 3) % 2 === 1 && i === n - 1 ? "w4" : "w2"));
$("#sections").innerHTML = SECTIONS.map(s => {
  const items = bySec(s.id);
  const alias = s.alias ? `<span id="${s.alias}" aria-hidden="true"></span>` : "";
  let grid;
  if (!items.length) {
    grid = `<div class="tile empty w4"><span class="top"><span class="n">In progress</span><span class="c">00</span></span><span class="soon">${esc(s.soon)}</span></div>`;
  } else {
    grid = items.map((p, i) => {
      const size = ITEM_SIZE(i, items.length);
      const media = p.cover ? `<span class="fr"><img src="${esc(p.cover)}" alt="" loading="lazy" width="960" height="540"></span>` : `<span class="soon"></span>`;
      return `<button type="button" class="tile ${size}" data-open="${esc(p.id)}" id="${esc(p.id)}"><span class="top"><span class="n">${esc(p.title)}</span><span class="c">${esc(p.tags?.[0] || "")}</span></span>${i === 0 ? `<p>${esc(p.summary)}</p>` : ""}${media}${ARROW}</button>`;
    }).join("");
    if (items.length === 1) grid += `<div class="tile empty w2 h2"><span class="top"><span class="n">Next up</span></span><span class="soon">${esc(s.soon)}</span></div>`;
    if (items.length === 2) grid = grid.replace('class="tile w2"', 'class="tile w2 h2"');
  }
  return `<section class="sec" id="${s.id}" aria-labelledby="h-${s.id}">${alias}<div class="sh"><h2 id="h-${s.id}">${s.name}</h2><p>${esc(s.blurb)}</p></div><div class="bento">${grid}</div></section>`;
}).join("");

/* Project panel */
const panel = $("#panel");
function openProject(id, push) {
  const p = PROJECTS.find(x => x.id === id);
  if (!p) return;
  const shots = p.shots || [];
  const first = shots[0] || { src: p.cover, alt: p.title, cap: "" };
  panel.innerHTML = `
    <button class="close" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="pd">
      <div class="media">
        ${first.src ? `<img class="main" src="${esc(first.src)}" alt="${esc(first.alt)}" width="960" height="540">` : ""}
        ${shots.length > 1 ? `<div class="thumbs" role="group" aria-label="${esc(p.title)} screenshots">${shots.map((s, i) => `<button type="button" aria-pressed="${i === 0}" data-i="${i}"><img src="${esc(s.src)}" alt="" width="192" height="108" loading="lazy"></button>`).join("")}</div>` : ""}
        <p class="cap" aria-live="polite">${esc(first.cap || "")}</p>
      </div>
      <div class="info">
        ${p.tags ? `<div class="tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
        <h3 id="pd-title">${esc(p.title)}${p.subtitle ? `<small>${esc(p.subtitle)}</small>` : ""}</h3>
        <p>${esc(p.body || p.summary)}</p>
        ${p.facts ? `<dl class="facts">${p.facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
        ${p.actions ? `<div class="acts">${p.actions.map(a => `<a class="btn${a.primary ? " primary" : ""}" href="${esc(a.href)}" target="_blank" rel="noopener"><div><b>${esc(a.label)}</b>${a.note ? `<span>${esc(a.note)}</span>` : ""}</div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>`).join("")}</div>` : ""}
      </div>
      ${p.controls ? `<div class="controls"><h4>Controls</h4><ul>${p.controls.map(([keys, label]) => `<li>${keys.map(k => `<kbd>${esc(k)}</kbd>`).join("")} ${esc(label)}</li>`).join("")}</ul></div>` : ""}
    </div>`;
  const main = panel.querySelector(".main"), cap = panel.querySelector(".cap");
  panel.querySelectorAll(".thumbs button").forEach(b => b.addEventListener("click", () => {
    panel.querySelectorAll(".thumbs button").forEach(x => x.setAttribute("aria-pressed", x === b));
    const s = shots[+b.dataset.i]; main.src = s.src; main.alt = s.alt; cap.textContent = s.cap || "";
  }));
  panel.querySelector(".close").addEventListener("click", () => panel.close());
  if (!panel.open) panel.showModal();
  if (push) history.replaceState(null, "", "#" + id);
}
panel.addEventListener("close", () => { if (PROJECTS.some(p => "#" + p.id === location.hash)) history.replaceState(null, "", "#" + PROJECTS.find(p => "#" + p.id === location.hash).section); });
panel.addEventListener("click", e => { if (e.target === panel) panel.close(); });
document.addEventListener("click", e => { const t = e.target.closest("[data-open]"); if (t) openProject(t.dataset.open, true); });

function fromHash() {
  const id = location.hash.slice(1);
  if (PROJECTS.some(p => p.id === id)) { document.getElementById(id)?.scrollIntoView({ block: "center" }); openProject(id, false); }
}
addEventListener("hashchange", fromHash);
fromHash();
/* Sections are rendered by script and the display font loads late, so re-apply a section link once layout settles. */
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
const toSection = () => {
  const id = location.hash.slice(1);
  if (id && !PROJECTS.some(p => p.id === id)) document.getElementById(id)?.scrollIntoView({ behavior: "instant" });
};
toSection();
document.fonts?.ready.then(toSection);
addEventListener("load", toSection);

/* Highlight the nav pill for the section in view */
if ("IntersectionObserver" in window) {
  const pills = [...document.querySelectorAll("#pills a")];
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) pills.forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + e.target.id));
  }), { rootMargin: "-35% 0px -60% 0px" });
  document.querySelectorAll(".hero, .sec").forEach(s => io.observe(s));
}
</script>
</body>
</html>
